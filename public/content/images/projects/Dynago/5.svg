<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="wasmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#060911"/>

  <g transform="translate(60, 40)">
    <rect width="1480" height="820" rx="20" fill="#0c111d" stroke="#1e293b" stroke-width="2"/>
    <rect width="1480" height="52" rx="20" fill="#111827"/>
    <rect y="40" width="1480" height="12" fill="#111827"/>

    <circle cx="28" cy="26" r="6" fill="#ef4444"/>
    <circle cx="48" cy="26" r="6" fill="#f59e0b"/>
    <circle cx="68" cy="26" r="6" fill="#10b981"/>

    <rect x="110" y="12" width="600" height="28" rx="8" fill="#080d1a" stroke="#1f293d" stroke-width="1"/>
    <text x="130" y="30" font-family="'JetBrains Mono', monospace" font-size="12" fill="#818cf8">dynago://plugins <tspan fill="#64748b">— WebAssembly (Wazero) In-Process Sandboxed Runtime</tspan></text>

    <!-- Header bar -->
    <g transform="translate(0, 52)">
      <rect width="1480" height="56" fill="#0e1526" stroke="#1e293b" stroke-width="1"/>
      <text x="32" y="35" font-family="-apple-system, sans-serif" font-size="18" font-weight="900" fill="#ffffff" letter-spacing="2">DYNAGO</text>
      <rect x="125" y="16" width="165" height="24" rx="12" fill="#6366f1" fill-opacity="0.25" stroke="#818cf8" stroke-width="1"/>
      <text x="207" y="32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#a5b4fc">WAZERO WASM ENGINE</text>

      <g transform="translate(1260, 12)">
        <rect width="180" height="32" rx="16" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
        <text x="90" y="21" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#34d399">ZERO CGO • PURE GO</text>
      </g>
    </g>

    <!-- Two Main Columns: Architecture & Code Window -->
    <g transform="translate(36, 128)">
      <!-- Left Column: Wasm Engine & Host Capabilities -->
      <g transform="translate(0, 0)">
        <rect width="650" height="660" rx="16" fill="#090e18" stroke="#1e293b" stroke-width="1.5"/>
        <rect width="650" height="42" rx="16" fill="#0f172a"/>
        <text x="24" y="27" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#a5b4fc">Sandboxed Execution &amp; Host Call ABI</text>

        <!-- Hook Types Box -->
        <g transform="translate(24, 60)">
          <rect width="602" height="150" rx="12" fill="#080e1a" stroke="#1e293b" stroke-width="1.2"/>
          <text x="20" y="28" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38bdf8">HOOK TYPES &amp; EXECUTION PHASES</text>
          
          <text x="20" y="58" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f43f5e">prehook  <tspan fill="#cbd5e1">➔ Fires BEFORE INSERT/UPDATE (normalize, validate, external checks)</tspan></text>
          <text x="20" y="86" font-family="'JetBrains Mono', monospace" font-size="12" fill="#34d399">posthook <tspan fill="#cbd5e1">➔ Fires AFTER SELECT/commit (mask PII, audit log, enrich fields)</tspan></text>
          <text x="20" y="114" font-family="'JetBrains Mono', monospace" font-size="12" fill="#a855f7">route    <tspan fill="#cbd5e1">➔ Dedicated HTTP endpoints (/api/v1/functions/{name}, /api/v1/rpc/{name})</tspan></text>
          <text x="20" y="138" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b">File naming convention: {table}_{hooktype}.wasm or {name}_route.wasm</text>
        </g>

        <!-- Host ABI Functions Box -->
        <g transform="translate(24, 230)">
          <rect width="602" height="210" rx="12" fill="#080e1a" stroke="#1e293b" stroke-width="1.2"/>
          <text x="20" y="28" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#818cf8">HOST FUNCTIONS EXPOSED TO WASM MODULES</text>

          <text x="20" y="60" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f8fafc">host_log(ptr, len) <tspan fill="#64748b">➔ stdout logs with [wasm:log] prefix</tspan></text>
          <text x="20" y="88" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f8fafc">http_get(url_ptr, url_len) <tspan fill="#64748b">➔ Non-blocking outbound GET (5s timeout)</tspan></text>
          <text x="20" y="116" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f8fafc">http_post(url_ptr, url_len, body_ptr, body_len) <tspan fill="#64748b">➔ Outbound JSON POST</tspan></text>
          <text x="20" y="144" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f8fafc">http_request(...) <tspan fill="#64748b">➔ Arbitrary HTTP calls (PUT, DELETE, PATCH)</tspan></text>
          <text x="20" y="172" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f8fafc">alloc(size) ➔ ptr <tspan fill="#64748b">➔ Linear guest memory buffer management</tspan></text>
          <text x="20" y="196" font-family="-apple-system, sans-serif" font-size="11" fill="#10b981">✓ Memory isolated • Zero access to host filesystem or unauthorized sockets</text>
        </g>

        <!-- Multi-language Toolchain -->
        <g transform="translate(24, 460)">
          <rect width="602" height="175" rx="12" fill="#080e1a" stroke="#1e293b" stroke-width="1.2"/>
          <text x="20" y="28" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">Polyglot Guest Language Support:</text>
          <g transform="translate(20, 50)">
            <rect width="170" height="42" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
            <text x="85" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38bdf8">TinyGo / Go</text>

            <rect x="190" y="0" width="170" height="42" rx="8" fill="#0f172a" stroke="#f43f5e" stroke-width="1"/>
            <text x="275" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#f43f5e">Rust (wasm32-wasi)</text>

            <rect x="380" y="0" width="190" height="42" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
            <text x="475" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#f59e0b">AssemblyScript (TS)</text>
          </g>
          <text x="20" y="125" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Hot reload: Drop a compiled <tspan font-family="'JetBrains Mono', monospace" fill="#ffffff">.wasm</tspan> into <tspan font-family="'JetBrains Mono', monospace" fill="#ffffff">./plugins/</tspan> and Dynago auto-binds it instantly without restarting the server!</text>
        </g>
      </g>

      <!-- Right Column: Code Snippet of TinyGo Plugin -->
      <g transform="translate(680, 0)">
        <rect width="728" height="660" rx="16" fill="#090e18" stroke="#1e293b" stroke-width="1.5"/>
        <rect width="728" height="42" rx="16" fill="#0f172a"/>
        <text x="24" y="27" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#34d399">plugins/orders_prehook/main.go (TinyGo Wasm Guest)</text>

        <!-- Code Content -->
        <g transform="translate(24, 60)">
          <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f43f5e">package <tspan fill="#f8fafc">main</tspan></text>
          
          <text x="0" y="55" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b">//export handle</text>
          <text x="0" y="75" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f43f5e">func <tspan fill="#38bdf8">handle</tspan><tspan fill="#f8fafc">(ptr, length uint32) uint64 {</tspan></text>
          
          <text x="20" y="105" font-family="'JetBrains Mono', monospace" font-size="12" fill="#cbd5e1">inBytes := unsafe.Slice((*byte)(unsafe.Pointer(uintptr(ptr))), length)</text>
          <text x="20" y="130" font-family="'JetBrains Mono', monospace" font-size="12" fill="#cbd5e1">var order struct { Total float64 `json:"total"` }</text>
          <text x="20" y="155" font-family="'JetBrains Mono', monospace" font-size="12" fill="#cbd5e1">_ = json.Unmarshal(inBytes, &amp;order)</text>

          <text x="20" y="195" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b">// Trigger outbound HTTP fraud check if order is high-value</text>
          <text x="20" y="220" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f43f5e">if <tspan fill="#cbd5e1">order.Total &gt; </tspan><tspan fill="#f59e0b">500.0 </tspan><tspan fill="#f8fafc">{</tspan></text>
          <text x="40" y="245" font-family="'JetBrains Mono', monospace" font-size="12" fill="#cbd5e1">url := "https://fraud-check.internal/verify"</text>
          <text x="40" y="270" font-family="'JetBrains Mono', monospace" font-size="12" fill="#818cf8">res := http_post(toPtr(url), len(url), toPtr(inBytes), len(inBytes))</text>
          <text x="40" y="295" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8">host_log("High value order verified through host HTTP")</text>
          <text x="20" y="320" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f8fafc">}</text>

          <text x="20" y="360" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b">// Return packed pointer and length to Dynago runtime</text>
          <text x="20" y="385" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f43f5e">return <tspan fill="#f8fafc">(uint64(outPtr) &lt;&lt; 32) | uint64(len(outBytes))</tspan></text>
          <text x="0" y="410" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f8fafc">}</text>

          <!-- Execution Card -->
          <g transform="translate(0, 440)">
            <rect width="680" height="135" rx="12" fill="#040711" stroke="#1e293b" stroke-width="1"/>
            <text x="18" y="28" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">RUNTIME EXECUTION LOG (Wazero JIT)</text>
            <text x="18" y="55" font-family="'JetBrains Mono', monospace" font-size="12" fill="#cbd5e1">[wasm:init] Loaded plugin: orders_prehook.wasm (42KB)</text>
            <text x="18" y="78" font-family="'JetBrains Mono', monospace" font-size="12" fill="#cbd5e1">[wasm:log] High value order verified through host HTTP</text>
            <text x="18" y="102" font-family="'JetBrains Mono', monospace" font-size="12" fill="#10b981">[dynago:commit] Hook passed in 0.41ms ➔ Database INSERT committed</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
