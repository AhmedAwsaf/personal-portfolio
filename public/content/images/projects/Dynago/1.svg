<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0b1326"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="accentIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#canvasBg)"/>

  <!-- Subtle Blueprint Grid Pattern -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="1600" height="900" fill="url(#grid)"/>
  </g>

  <!-- Top Hero Header Bar -->
  <g transform="translate(60, 50)">
    <!-- Dynago Badge -->
    <rect x="0" y="0" width="135" height="34" rx="17" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="67" y="22" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1.5">CORE ENGINE</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Dynago <tspan fill="#38bdf8">—</tspan> <tspan fill="#e2e8f0" font-weight="600">Dynamic PostgreSQL REST API Engine</tspan>
    </text>

    <!-- Subtitle / Architecture Philosophy -->
    <text x="0" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" fill="#94a3b8">
      Zero ORM Boilerplate • Single-Query JSON Compilation • In-Memory &amp; Redis Cache • Wazero Wasm Plugins • Real-Time CDC WAL
    </text>
  </g>

  <!-- 3-Pillar Architectural Diagram Grid -->

  <!-- 1. LEFT CARD: PostgreSQL Database Introspection -->
  <g transform="translate(60, 210)">
    <rect width="450" height="620" rx="24" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="2"/>
    <rect width="450" height="6" rx="3" fill="url(#accentCyan)"/>

    <!-- Header -->
    <g transform="translate(32, 40)">
      <circle cx="16" cy="16" r="16" fill="#0284c7" fill-opacity="0.2"/>
      <path d="M 8 16 L 24 16 M 16 8 L 16 24" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
      <text x="44" y="22" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#f8fafc">1. PostgreSQL Introspection</text>
      <text x="44" y="44" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b">Startup Graph Discovery</text>
    </g>

    <!-- DB Topology Visual Mock -->
    <g transform="translate(32, 110)">
      <rect width="386" height="135" rx="14" fill="#0b1120" stroke="#1e293b" stroke-width="1.5"/>
      <text x="20" y="32" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#38bdf8">schema_graph.go</text>
      <text x="20" y="60" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">Tables: users, orders, items, receipts</text>
      <text x="20" y="84" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">PKeys: users(id), orders(id)</text>
      <text x="20" y="108" font-family="'JetBrains Mono', monospace" font-size="12" fill="#10b981">Foreign Keys: orders.user_id ➔ users.id</text>
    </g>

    <!-- CDC Logical Replication Sub-card -->
    <g transform="translate(32, 265)">
      <rect width="386" height="155" rx="14" fill="#0b1120" stroke="#1e293b" stroke-width="1.5"/>
      <text x="20" y="32" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#a855f7">Logical Replication (CDC)</text>
      <text x="20" y="60" font-family="'JetBrains Mono', monospace" font-size="12" fill="#cbd5e1">• PostgreSQL WAL Stream Tap</text>
      <text x="20" y="84" font-family="'JetBrains Mono', monospace" font-size="12" fill="#cbd5e1">• Decoding via <tspan fill="#38bdf8">test_decoding</tspan> slot</text>
      <text x="20" y="108" font-family="'JetBrains Mono', monospace" font-size="12" fill="#cbd5e1">• Intercepts direct psql &amp; external writes</text>
      <text x="20" y="132" font-family="'JetBrains Mono', monospace" font-size="12" fill="#10b981">✓ Auto-triggers targeted cache eviction</text>
    </g>

    <!-- Features Pill List -->
    <g transform="translate(32, 440)">
      <rect width="386" height="145" rx="14" fill="#080e1a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="20" y="34" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">Dynamic Metadata Highlights:</text>
      <text x="20" y="64" font-family="-apple-system, sans-serif" font-size="13" fill="#94a3b8">✓ Zero manual route or struct declarations</text>
      <text x="20" y="90" font-family="-apple-system, sans-serif" font-size="13" fill="#94a3b8">✓ Hot-reload via <tspan font-family="'JetBrains Mono', monospace" fill="#38bdf8">POST /api/v1/_refresh</tspan></text>
      <text x="20" y="116" font-family="-apple-system, sans-serif" font-size="13" fill="#94a3b8">✓ Automatic data type coercion &amp; validation</text>
    </g>
  </g>

  <!-- 2. MIDDLE CARD: The High-Speed Query Compiler Engine -->
  <g transform="translate(540, 210)">
    <rect width="520" height="620" rx="24" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2.5" filter="url(#subtleGlow)"/>
    <rect width="520" height="6" rx="3" fill="url(#accentCyan)"/>

    <!-- Header -->
    <g transform="translate(32, 40)">
      <circle cx="16" cy="16" r="16" fill="#0284c7" fill-opacity="0.3"/>
      <text x="16" y="21" text-anchor="middle" font-size="14" fill="#38bdf8">⚡</text>
      <text x="44" y="22" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#f8fafc">2. Single-Query JSON Compiler</text>
      <text x="44" y="44" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8">Pure Go • Zero Marshaling • Anti-N+1</text>
    </g>

    <!-- Incoming HTTP Request Box -->
    <g transform="translate(32, 90)">
      <rect width="456" height="75" rx="12" fill="#070c18" stroke="#334155" stroke-width="1.5"/>
      <rect x="16" y="16" width="45" height="24" rx="6" fill="#0284c7"/>
      <text x="38" y="32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#ffffff">GET</text>
      <text x="70" y="33" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f8fafc">/api/v1/users?select=id,name,orders(id,total)</text>
      <text x="18" y="58" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">Filter: &amp;orders.status=eq.shipped&amp;order=name.asc</text>
    </g>

    <!-- Downward Arrow -->
    <g transform="translate(260, 180)">
      <path d="M 0 0 L 0 20 M -6 14 L 0 20 L 6 14" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Compiled SQL Terminal Display -->
    <g transform="translate(32, 215)">
      <rect width="456" height="195" rx="14" fill="#030712" stroke="#1e293b" stroke-width="1.5"/>
      <!-- Window controls -->
      <circle cx="20" cy="18" r="5" fill="#ef4444"/>
      <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
      <circle cx="52" cy="18" r="5" fill="#10b981"/>
      <text x="72" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">Compiled SQL (Postgres Native JSON)</text>

      <!-- SQL Snippet -->
      <text x="20" y="55" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f43f5e">SELECT <tspan fill="#38bdf8">json_agg(</tspan><tspan fill="#a855f7">json_build_object(</tspan></text>
      <text x="35" y="80" font-family="'JetBrains Mono', monospace" font-size="12" fill="#cbd5e1">'id', u.id, 'name', u.name,</text>
      <text x="35" y="105" font-family="'JetBrains Mono', monospace" font-size="12" fill="#cbd5e1">'orders', (SELECT <tspan fill="#38bdf8">json_agg(</tspan><tspan fill="#a855f7">json_build_object(</tspan></text>
      <text x="50" y="130" font-family="'JetBrains Mono', monospace" font-size="12" fill="#cbd5e1">'id', o.id, 'total', o.total))</text>
      <text x="35" y="155" font-family="'JetBrains Mono', monospace" font-size="12" fill="#cbd5e1">FROM orders o WHERE o.user_id = u.id)</text>
      <text x="20" y="180" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f43f5e"><tspan fill="#a855f7">))</tspan> FROM users u;</text>
    </g>

    <!-- Speed Benchmarks & Zero-Copy Feature Box -->
    <g transform="translate(32, 428)">
      <rect width="456" height="160" rx="14" fill="#080e1a" stroke="#1e293b" stroke-width="1.5"/>
      <g transform="translate(24, 28)">
        <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">PERFORMANCE &amp; THROUGHPUT ADVANTAGES</text>
        <text x="0" y="28" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">⚡ <tspan font-weight="700" fill="#ffffff">Raw Zero-Copy Streaming:</tspan> Bytes stream straight to client</text>
        <text x="0" y="52" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">⚡ <tspan font-weight="700" fill="#ffffff">Zero Go Struct Allocation:</tspan> Eliminates unmarshaling CPU cost</text>
        <text x="0" y="76" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">⚡ <tspan font-weight="700" fill="#ffffff">In-Memory / Redis Cache:</tspan> With X-Dynago-Cache: HIT headers</text>
        <text x="0" y="100" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">⚡ <tspan font-weight="700" fill="#10b981">Latency Metric:</tspan> Sub-millisecond execution (<tspan font-weight="700">0.8ms</tspan>)</text>
      </g>
    </g>
  </g>

  <!-- 3. RIGHT CARD: Extended Platform Capabilities -->
  <g transform="translate(1090, 210)">
    <rect width="450" height="620" rx="24" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="2"/>
    <rect width="450" height="6" rx="3" fill="url(#accentIndigo)"/>

    <!-- Header -->
    <g transform="translate(32, 40)">
      <circle cx="16" cy="16" r="16" fill="#6366f1" fill-opacity="0.2"/>
      <path d="M 12 16 L 20 16 M 16 12 L 16 20" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
      <text x="44" y="22" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#f8fafc">3. Ecosystem &amp; Runtime</text>
      <text x="44" y="44" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b">Wasm • Auth • Dashboard</text>
    </g>

    <!-- WebAssembly (Wazero) Subcard -->
    <g transform="translate(32, 100)">
      <rect width="386" height="145" rx="14" fill="#0b1120" stroke="#1e293b" stroke-width="1.5"/>
      <text x="20" y="30" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#818cf8">WebAssembly (Wazero) Plugins</text>
      <text x="20" y="58" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">• Pre/Post table mutation hooks (.wasm)</text>
      <text x="20" y="82" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">• Polyglot: TinyGo, Rust, AssemblyScript</text>
      <text x="20" y="106" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">• Host Outbound HTTP (http_get, http_post)</text>
      <text x="20" y="128" font-family="-apple-system, sans-serif" font-size="12" fill="#10b981">✓ Zero-CGO pure Go sandboxed execution</text>
    </g>

    <!-- Embedded Web UI Dashboard Subcard -->
    <g transform="translate(32, 260)">
      <rect width="386" height="145" rx="14" fill="#0b1120" stroke="#1e293b" stroke-width="1.5"/>
      <text x="20" y="30" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#38bdf8">Interactive Web UI Dashboard</text>
      <text x="20" y="58" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">• Embedded single-page dashboard at /ui</text>
      <text x="20" y="82" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">• In-browser SQL Runner + CSV Export</text>
      <text x="20" y="106" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">• Data Explorer with dynamic multi-filters</text>
      <text x="20" y="128" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">• Example request/response JSON generator</text>
    </g>

    <!-- Security & RBAC Subcard -->
    <g transform="translate(32, 420)">
      <rect width="386" height="165" rx="14" fill="#080e1a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="20" y="32" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#10b981">JWT Auth &amp; Table-Level RBAC</text>
      <text x="20" y="60" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">• Built-in user registration &amp; JWT login</text>
      <text x="20" y="84" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">• Roles: admin, editor, viewer, anon</text>
      <text x="20" y="108" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">• Public vs. Private table access control</text>
      <text x="20" y="132" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">• Real-Time SSE Stream per table &amp; global</text>
      <text x="20" y="152" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b">Internal system tables: _dynago_users, _dynago_permissions</text>
    </g>
  </g>
</svg>
