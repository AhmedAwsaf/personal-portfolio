<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#060911"/>

  <g transform="translate(60, 40)">
    <!-- Browser Window -->
    <rect width="1480" height="820" rx="20" fill="#0c111d" stroke="#1e293b" stroke-width="2"/>
    <rect width="1480" height="52" rx="20" fill="#111827"/>
    <rect y="40" width="1480" height="12" fill="#111827"/>

    <circle cx="28" cy="26" r="6" fill="#ef4444"/>
    <circle cx="48" cy="26" r="6" fill="#f59e0b"/>
    <circle cx="68" cy="26" r="6" fill="#10b981"/>

    <rect x="110" y="12" width="600" height="28" rx="8" fill="#080d1a" stroke="#1f293d" stroke-width="1"/>
    <text x="130" y="30" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8">http://localhost:8080/ui#stream <tspan fill="#64748b">— Real-Time Mutation Stream (SSE &amp; CDC)</tspan></text>

    <!-- Top Sub-Bar with Tabs -->
    <g transform="translate(0, 52)">
      <rect width="1480" height="56" fill="#0e1526" stroke="#1e293b" stroke-width="1"/>
      <text x="32" y="35" font-family="-apple-system, sans-serif" font-size="18" font-weight="900" fill="#ffffff" letter-spacing="2">DYNAGO</text>

      <g transform="translate(180, 12)">
        <text x="50" y="22" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Endpoints</text>
        <text x="160" y="22" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">SQL Console</text>
        <rect x="250" y="0" width="135" height="32" rx="8" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="1.2"/>
        <text x="317" y="21" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#c084fc">Live Stream (SSE)</text>
        <text x="440" y="22" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Permissions</text>
      </g>

      <!-- Connection Live Pulse -->
      <g transform="translate(1260, 12)">
        <rect width="180" height="32" rx="16" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
        <circle cx="20" cy="16" r="5" fill="#10b981"/>
        <text x="95" y="21" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#34d399">CONNECTED (LIVE)</text>
      </g>
    </g>

    <!-- Two-Column Layout: Left CDC Architecture, Right Live Event Feed -->
    <g transform="translate(36, 128)">
      <!-- Left: How CDC Works Diagram Box -->
      <g transform="translate(0, 0)">
        <rect width="520" height="660" rx="16" fill="#090e18" stroke="#1e293b" stroke-width="1.5"/>
        <rect width="520" height="42" rx="16" fill="#0f172a"/>
        <text x="24" y="27" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">PostgreSQL WAL Logical Decoding</text>

        <!-- Diagram Step 1 -->
        <g transform="translate(24, 60)">
          <rect width="472" height="110" rx="12" fill="#080e1a" stroke="#1e293b" stroke-width="1.2"/>
          <text x="18" y="28" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#f43f5e">1. Write-Ahead Log (WAL) Tap</text>
          <text x="18" y="52" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">Consumes slot <tspan font-family="'JetBrains Mono', monospace" fill="#38bdf8">dynago_cdc_slot</tspan> via <tspan font-family="'JetBrains Mono', monospace" fill="#38bdf8">test_decoding</tspan>.</text>
          <text x="18" y="74" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Captures external inserts from psql, background workers, or migrations.</text>
          <text x="18" y="96" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10b981">✓ Polling interval: 250ms (Zero crash graceful fallback)</text>
        </g>

        <!-- Diagram Step 2 -->
        <g transform="translate(24, 185)">
          <rect width="472" height="110" rx="12" fill="#080e1a" stroke="#1e293b" stroke-width="1.2"/>
          <text x="18" y="28" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#a855f7">2. Deterministic Cache Invalidation</text>
          <text x="18" y="52" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">Targeted table eviction removes only matching entries:</text>
          <text x="18" y="74" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f59e0b">FLUSH KEY "dynago:select:/api/v1/orders*"</text>
          <text x="18" y="96" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Other cached tables (users, products) remain unaffected.</text>
        </g>

        <!-- Diagram Step 3 -->
        <g transform="translate(24, 310)">
          <rect width="472" height="120" rx="12" fill="#080e1a" stroke="#1e293b" stroke-width="1.2"/>
          <text x="18" y="28" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#10b981">3. Instant Fanout to Connected Clients</text>
          <text x="18" y="52" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">Mutation events dispatched over HTTP chunked streaming:</text>
          <text x="18" y="74" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8">GET /api/v1/stream</text>
          <text x="18" y="94" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8">GET /api/v1/stream/{table}</text>
          <text x="18" y="112" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b">Zero client polling required • Native EventSource API</text>
        </g>

        <!-- cURL Listen Command Box -->
        <g transform="translate(24, 450)">
          <rect width="472" height="185" rx="12" fill="#040711" stroke="#1e293b" stroke-width="1"/>
          <text x="18" y="28" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">CLI STREAM LISTENER</text>
          <text x="18" y="55" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f43f5e">curl <tspan fill="#cbd5e1">-N http://localhost:8080/api/v1/stream/orders</tspan></text>
          
          <text x="18" y="90" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">JS BROWSER CLIENT</text>
          <text x="18" y="115" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8">const <tspan fill="#f8fafc">es = new EventSource('/api/v1/stream/orders');</tspan></text>
          <text x="18" y="138" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f8fafc">es.addEventListener(<tspan fill="#34d399">'INSERT'</tspan>, e =&gt; {</text>
          <text x="36" y="158" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f8fafc">console.log(JSON.parse(e.data));</text>
          <text x="18" y="176" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f8fafc">});</text>
        </g>
      </g>

      <!-- Right: Live Event Monitor Stream -->
      <g transform="translate(545, 0)">
        <rect width="863" height="660" rx="16" fill="#090e18" stroke="#1e293b" stroke-width="1.5"/>
        <rect width="863" height="42" rx="16" fill="#0f172a"/>
        <text x="24" y="27" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Live Event Stream Feed</text>
        <text x="839" y="27" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10b981">Listening on: /api/v1/stream/orders</text>

        <!-- Stream Event 1: Connected -->
        <g transform="translate(24, 60)">
          <rect width="815" height="75" rx="12" fill="#080e1a" stroke="#1e293b" stroke-width="1.2"/>
          <rect x="18" y="14" width="90" height="22" rx="11" fill="#0284c7" fill-opacity="0.25"/>
          <text x="63" y="29" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#38bdf8">CONNECTED</text>
          <text x="120" y="29" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">2026-10-11T04:30:00Z • handshake established</text>
          <text x="18" y="55" font-family="'JetBrains Mono', monospace" font-size="12" fill="#cbd5e1">{"connected": true, "table": "orders", "message": "subscribed to real-time mutation stream"}</text>
        </g>

        <!-- Stream Event 2: INSERT -->
        <g transform="translate(24, 150)">
          <rect width="815" height="150" rx="12" fill="#091815" stroke="#10b981" stroke-width="1.5"/>
          <rect x="18" y="14" width="75" height="22" rx="11" fill="#10b981"/>
          <text x="55" y="29" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" fill="#042f2e">INSERT</text>
          <text x="105" y="29" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34d399">Table: orders • 2026-10-11T04:30:15Z (Via WAL test_decoding)</text>

          <g transform="translate(18, 48)">
            <rect width="779" height="88" rx="8" fill="#030712"/>
            <text x="16" y="24" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f8fafc">{</text>
            <text x="32" y="46" font-family="'JetBrains Mono', monospace" font-size="12" fill="#7dd3fc">"id"<tspan fill="#f8fafc">: </tspan><tspan fill="#f59e0b">104</tspan><tspan fill="#f8fafc">, </tspan><tspan fill="#7dd3fc">"customer_id"</tspan><tspan fill="#f8fafc">: </tspan><tspan fill="#f59e0b">1</tspan><tspan fill="#f8fafc">, </tspan><tspan fill="#7dd3fc">"total_amount"</tspan><tspan fill="#f8fafc">: </tspan><tspan fill="#f59e0b">420.00</tspan><tspan fill="#f8fafc">, </tspan><tspan fill="#7dd3fc">"status"</tspan><tspan fill="#f8fafc">: </tspan><tspan fill="#34d399">"pending"</tspan></text>
            <text x="16" y="68" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f8fafc">}</text>
          </g>
        </g>

        <!-- Stream Event 3: UPDATE -->
        <g transform="translate(24, 315)">
          <rect width="815" height="150" rx="12" fill="#141a29" stroke="#38bdf8" stroke-width="1.5"/>
          <rect x="18" y="14" width="75" height="22" rx="11" fill="#0284c7"/>
          <text x="55" y="29" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" fill="#ffffff">UPDATE</text>
          <text x="105" y="29" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">Table: orders • 2026-10-11T04:30:28Z (Cache Key Evicted)</text>

          <g transform="translate(18, 48)">
            <rect width="779" height="88" rx="8" fill="#030712"/>
            <text x="16" y="24" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f8fafc">{</text>
            <text x="32" y="46" font-family="'JetBrains Mono', monospace" font-size="12" fill="#7dd3fc">"id"<tspan fill="#f8fafc">: </tspan><tspan fill="#f59e0b">104</tspan><tspan fill="#f8fafc">, </tspan><tspan fill="#7dd3fc">"status"</tspan><tspan fill="#f8fafc">: </tspan><tspan fill="#34d399">"shipped"</tspan><tspan fill="#f8fafc">, </tspan><tspan fill="#7dd3fc">"tracking_no"</tspan><tspan fill="#f8fafc">: </tspan><tspan fill="#34d399">"DYN-9481-US"</tspan></text>
            <text x="16" y="68" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f8fafc">}</text>
          </g>
        </g>

        <!-- Stream Event 4: PG Hook Webhook Dispatched Notice -->
        <g transform="translate(24, 480)">
          <rect width="815" height="85" rx="12" fill="#120c18" stroke="#a855f7" stroke-width="1.2"/>
          <text x="18" y="28" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#c084fc">PG Hook (Webhook) Fired ➔ POST https://api.myservice.com/webhooks</text>
          <text x="18" y="52" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">Payload dispatched with HMAC signature for asynchronous audit logging &amp; event sourcing.</text>
        </g>
      </g>
    </g>
  </g>
</svg>
