      <rect x="83" y="0" width="92" height="20" rx="6" fill="#3b82f6" fill-opacity="0.2"/>
      <text x="129" y="14" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#93c5fd">500+ SKUS</text>
