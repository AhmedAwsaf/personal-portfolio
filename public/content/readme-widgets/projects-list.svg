    <text x="108" y="27" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a78bfa">— Collaborative Android Social Platform</text>

    <text x="24" y="52" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Enterprise Kanban task coordination built with Kotlin KTX, Jetpack Compose, and MVVM architecture.</text>

