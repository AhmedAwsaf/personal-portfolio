    <text x="24" y="28" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff">Dynago</text>
    <text x="96" y="27" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">— Dynamic PostgreSQL REST API Engine</text>

    <text x="24" y="52" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Single-query json_build_object compiler, CDC logical replication, and Wazero Wasm sandboxed plugins.</text>

    <!-- Badges Right -->
    <g transform="translate(565, 14)">
      <rect width="72" height="20" rx="6" fill="#0284c7" fill-opacity="0.2"/>
      <text x="36" y="14" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#38bdf8">GO / WASM</text>

      <rect x="80" y="0" width="95" height="20" rx="6" fill="#10b981" fill-opacity="0.2"/>
      <text x="127" y="14" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#34d399">ACTIVE ENGINE</text>
