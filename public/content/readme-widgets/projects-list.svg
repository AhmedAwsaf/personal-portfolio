  <!-- Row 5: Capstone Thesis Simulation -->
  <g transform="translate(24, 408)">
    <rect width="752" height="74" rx="14" fill="#080e1a" stroke="#1e293b" stroke-width="1"/>
    <rect width="4" height="74" rx="2" fill="#f59e0b"/>

