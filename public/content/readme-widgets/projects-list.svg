<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="listCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0b1426"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <linearGradient id="rowHover1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="dynagoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Card Canvas -->
  <rect width="800" height="520" rx="24" fill="url(#listCardBg)"/>
  <rect width="798" height="518" x="1" y="1" rx="23" fill="none" stroke="#1e293b" stroke-width="1.8"/>

  <!-- Window Header -->
  <g transform="translate(24, 20)">
    <circle cx="8" cy="12" r="5" fill="#ef4444"/>
    <circle cx="24" cy="12" r="5" fill="#f59e0b"/>
    <circle cx="40" cy="12" r="5" fill="#10b981"/>

    <text x="65" y="16" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#94a3b8">ahmed-awsaf / engineering-showcase.md</text>

