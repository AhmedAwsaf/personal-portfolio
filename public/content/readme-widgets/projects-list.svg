    <text x="180" y="27" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fbbf24">— Computer Vision &amp; 3D Simulation</text>

    <text x="24" y="52" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Coupling YOLO v11 with Unity physics for heterogeneous traffic stress testing. Cataloged in BRACU Repository.</text>

    <g transform="translate(565, 14)">
      <rect width="80" height="20" rx="6" fill="#f59e0b" fill-opacity="0.2"/>
      <text x="40" y="14" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#fde68a">YOLO / UNITY</text>

      <rect x="88" y="0" width="87" height="20" rx="6" fill="#a855f7" fill-opacity="0.2"/>
      <text x="131" y="14" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#d8b4fe">ARCHIVED</text>
