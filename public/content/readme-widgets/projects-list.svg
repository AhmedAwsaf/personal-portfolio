    <rect x="625" y="0" width="125" height="24" rx="12" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1"/>
    <text x="687" y="15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38bdf8">9 PROJECTS TOTAL</text>
  </g>

  <!-- Divider -->
  <line x1="24" y1="56" x2="776" y2="56" stroke="#1e293b" stroke-width="1"/>

