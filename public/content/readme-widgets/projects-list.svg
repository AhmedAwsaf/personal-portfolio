  <!-- Row 4: Barobi Design -->
  <g transform="translate(24, 324)">
    <rect width="752" height="74" rx="14" fill="#080e1a" stroke="#1e293b" stroke-width="1"/>
    <rect width="4" height="74" rx="2" fill="#10b981"/>

