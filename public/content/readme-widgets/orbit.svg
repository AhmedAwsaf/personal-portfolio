<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="50%" stop-color="#0b1326"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b33"/>
      <stop offset="100%" stop-color="#070c17"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="strongGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      /* Orbital Rotations */
      @keyframes spinClockwise {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinCounter {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes pulseCore {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.03); opacity: 1; }
      }
      @keyframes ringGlow {
        0%, 100% { stroke-opacity: 0.4; }
        50% { stroke-opacity: 0.85; }
      }

      .orbit-plane-1 {
        transform-origin: 400px 240px;
        animation: spinClockwise 28s linear infinite;
      }
      .orbit-plane-2 {
        transform-origin: 400px 240px;
        animation: spinCounter 38s linear infinite;
      }
      .center-core {
        transform-origin: 400px 240px;
        animation: pulseCore 4s ease-in-out infinite;
      }
      .orbit-track {
        animation: ringGlow 6s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" rx="28" fill="url(#bgGrad)"/>
  <rect width="798" height="478" x="1" y="1" rx="27" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Star Dust / Cosmic Dots in Background -->
  <g opacity="0.3">
    <circle cx="120" cy="80" r="1.5" fill="#38bdf8"/>
    <circle cx="220" cy="380" r="1.2" fill="#818cf8"/>
    <circle cx="680" cy="110" r="1.8" fill="#38bdf8"/>
    <circle cx="710" cy="360" r="1.2" fill="#c084fc"/>
    <circle cx="90" cy="270" r="1.5" fill="#34d399"/>
    <circle cx="580" cy="60" r="1.5" fill="#93c5fd"/>
  </g>

  <!-- ==================== ORBITAL TRACK 1 (Outer Ring) ==================== -->
  <g transform="translate(400, 240)">
    <!-- Elliptical track tilted in 3D perspective -->
    <ellipse cx="0" cy="0" rx="310" ry="145" fill="none" stroke="url(#ringGrad)" stroke-width="1.8" stroke-dasharray="8 6" opacity="0.35" class="orbit-track" transform="rotate(-15)"/>
  </g>

  <!-- Animated Outer Orbit Satellites -->
  <g class="orbit-plane-1">
    <!-- Orbit 1 - Node 1: Go (Golang) -->
    <g transform="translate(680, 205)">
      <circle cx="0" cy="0" r="22" fill="#0d1829" stroke="#00add8" stroke-width="1.8" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" fill="#00add8">Go</text>
    </g>

    <!-- Orbit 1 - Node 2: PostgreSQL -->
    <g transform="translate(120, 275)">
      <circle cx="0" cy="0" r="22" fill="#0d1829" stroke="#336791" stroke-width="1.8" filter="url(#glow)"/>
      <text x="0" y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#38bdf8">POSTGRES</text>
    </g>

    <!-- Orbit 1 - Node 3: React -->
    <g transform="translate(400, 95)">
      <circle cx="0" cy="0" r="20" fill="#0d1829" stroke="#61dafb" stroke-width="1.8" filter="url(#glow)"/>
      <text x="0" y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#61dafb">REACT</text>
    </g>

    <!-- Orbit 1 - Node 4: Docker -->
    <g transform="translate(400, 385)">
      <circle cx="0" cy="0" r="20" fill="#0d1829" stroke="#2496ed" stroke-width="1.8" filter="url(#glow)"/>
      <text x="0" y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" fill="#60a5fa">DOCKER</text>
    </g>
  </g>

  <!-- ==================== ORBITAL TRACK 2 (Inner Ring) ==================== -->
  <g transform="translate(400, 240)">
    <ellipse cx="0" cy="0" rx="220" ry="105" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.3" transform="rotate(22)"/>
  </g>

  <!-- Animated Inner Orbit Satellites -->
  <g class="orbit-plane-2">
    <!-- Orbit 2 - Node 1: Python -->
    <g transform="translate(590, 255)">
      <circle cx="0" cy="0" r="20" fill="#0c1626" stroke="#3776ab" stroke-width="1.8" filter="url(#glow)"/>
      <text x="0" y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#facc15">PYTHON</text>
    </g>

    <!-- Orbit 2 - Node 2: Redis -->
    <g transform="translate(210, 225)">
      <circle cx="0" cy="0" r="19" fill="#180f14" stroke="#dc382d" stroke-width="1.8" filter="url(#glow)"/>
      <text x="0" y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#f87171">REDIS</text>
    </g>

    <!-- Orbit 2 - Node 3: WebAssembly -->
    <g transform="translate(400, 135)">
      <circle cx="0" cy="0" r="19" fill="#140f26" stroke="#654ff0" stroke-width="1.8" filter="url(#glow)"/>
      <text x="0" y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#c084fc">WASM</text>
    </g>

    <!-- Orbit 2 - Node 4: FastAPI -->
    <g transform="translate(400, 345)">
      <circle cx="0" cy="0" r="19" fill="#0a1917" stroke="#05998b" stroke-width="1.8" filter="url(#glow)"/>
      <text x="0" y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" fill="#34d399">FASTAPI</text>
    </g>
  </g>

  <!-- ==================== CENTER CORE (AHMED AWSAF) ==================== -->
  <g class="center-core">
    <!-- Core Ambient Glow -->
    <circle cx="400" cy="240" r="115" fill="#0284c7" fill-opacity="0.12" filter="url(#strongGlow)"/>

    <!-- Core Sphere Base -->
    <circle cx="400" cy="240" r="102" fill="url(#coreGrad)" stroke="url(#ringGrad)" stroke-width="2.5"/>

    <!-- Subtle Tech Inner Arc Rings -->
    <circle cx="400" cy="240" r="88" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="14 10" opacity="0.4"/>
    <circle cx="400" cy="240" r="76" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="6 8" opacity="0.3"/>

    <!-- Status Pill Above Name -->
    <rect x="330" y="174" width="140" height="20" rx="10" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="1"/>
    <circle cx="343" cy="184" r="3.5" fill="#34d399"/>
    <text x="403" y="188" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#34d399" letter-spacing="1">SYSTEMS &amp; DATA</text>

    <!-- MAIN NAME: AHMED AWSAF -->
    <text x="400" y="234" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="900" fill="#ffffff" letter-spacing="3.5">
      AHMED AWSAF
    </text>

    <!-- Accent Underline Bar -->
    <rect x="360" y="246" width="80" height="2" rx="1" fill="url(#ringGrad)"/>

    <!-- Subtitle Roles -->
    <text x="400" y="268" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1.2">
      Full-Stack &amp; Operations
    </text>
    <text x="400" y="286" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#64748b">
      Commure (Augmedix)
    </text>
  </g>
</svg>
