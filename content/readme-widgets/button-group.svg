<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 70" width="100%" height="100%">
  <defs>
    <linearGradient id="btnBarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
  </defs>

  <rect width="800" height="70" rx="18" fill="url(#btnBarBg)"/>
  <rect width="798" height="68" x="1" y="1" rx="17" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Button 1: Live Portfolio -->
  <g transform="translate(18, 14)">
    <rect width="145" height="42" rx="12" fill="#0c1626" stroke="#0284c7" stroke-width="1.4"/>
    <circle cx="20" cy="21" r="5" fill="#38bdf8"/>
    <text x="34" y="26" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Live Portfolio</text>
  </g>

  <!-- Button 2: Dynago -->
  <g transform="translate(173, 14)">
    <rect width="145" height="42" rx="12" fill="#111026" stroke="#6366f1" stroke-width="1.4"/>
    <text x="20" y="26" font-size="13">⚡</text>
    <text x="38" y="26" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Dynago Engine</text>
  </g>

  <!-- Button 3: CV / Resume -->
  <g transform="translate(328, 14)">
    <rect width="135" height="42" rx="12" fill="#081815" stroke="#10b981" stroke-width="1.4"/>
    <text x="20" y="26" font-size="13">📄</text>
    <text x="38" y="26" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Resume (PDF)</text>
  </g>

  <!-- Button 4: LinkedIn -->
  <g transform="translate(473, 14)">
    <rect width="145" height="42" rx="12" fill="#0b162c" stroke="#2563eb" stroke-width="1.4"/>
    <text x="20" y="26" font-size="13">💼</text>
    <text x="38" y="26" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">LinkedIn Profile</text>
  </g>

  <!-- Button 5: Space Shooter Arcade -->
  <g transform="translate(628, 14)">
    <rect width="154" height="42" rx="12" fill="#1c130b" stroke="#f59e0b" stroke-width="1.4"/>
    <text x="18" y="26" font-size="13">🎮</text>
    <text x="36" y="26" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Play Arcade 2D</text>
  </g>
</svg>