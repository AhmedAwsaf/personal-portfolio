<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="dbCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#060911"/>

  <!-- Browser Window Wrapper -->
  <g transform="translate(60, 40)">
    <!-- Browser Chrome Frame -->
    <rect width="1480" height="820" rx="20" fill="#0c111d" stroke="#1e293b" stroke-width="2"/>
    <rect width="1480" height="52" rx="20" fill="#111827"/>
    <rect y="40" width="1480" height="12" fill="#111827"/>

    <!-- Window Dots -->
    <circle cx="28" cy="26" r="6" fill="#ef4444"/>
    <circle cx="48" cy="26" r="6" fill="#f59e0b"/>
    <circle cx="68" cy="26" r="6" fill="#10b981"/>

    <!-- URL Bar -->
    <rect x="110" y="12" width="600" height="28" rx="8" fill="#080d1a" stroke="#1f293d" stroke-width="1"/>
    <text x="130" y="30" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8">http://localhost:8080/ui <tspan fill="#64748b">— Dynago Dashboard</tspan></text>

    <!-- Navigation Header -->
    <g transform="translate(0, 52)">
      <rect width="1480" height="60" fill="#0e1526" stroke="#1e293b" stroke-width="1"/>
      
      <!-- Brand -->
      <text x="32" y="38" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="2">DYNAGO</text>
      <rect x="132" y="20" width="64" height="22" rx="11" fill="#0284c7" fill-opacity="0.2"/>
      <text x="164" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38bdf8">ENGINE</text>

      <!-- Tabs -->
      <g transform="translate(240, 16)">
        <rect x="0" y="0" width="120" height="32" rx="8" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.2"/>
        <text x="60" y="21" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Endpoints</text>

        <text x="175" y="21" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">SQL Console</text>
        <text x="295" y="21" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Data Explorer</text>
        <text x="425" y="21" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Functions (RPC)</text>
        <text x="560" y="21" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Live Stream</text>
        <text x="680" y="21" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Permissions</text>
      </g>

      <!-- Right Auth Button -->
      <g transform="translate(1320, 15)">
        <rect width="130" height="32" rx="16" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.2"/>
        <circle cx="20" cy="16" r="4" fill="#10b981"/>
        <text x="68" y="21" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#34d399">admin (admin)</text>
      </g>
    </g>

    <!-- Main Workspace Split: Sidebar & Main View -->
    <!-- Sidebar: Discovered Tables -->
    <g transform="translate(0, 112)">
      <rect width="280" height="708" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
      <text x="24" y="36" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1.5">DISCOVERED SCHEMAS (4)</text>

      <!-- Table Item 1: Active Users -->
      <g transform="translate(16, 55)">
        <rect width="248" height="52" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
        <text x="18" y="28" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">users</text>
        <text x="18" y="44" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8">4 routes • public</text>
        <rect x="185" y="16" width="50" height="20" rx="10" fill="#10b981" fill-opacity="0.2"/>
        <text x="210" y="30" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#34d399">PUBLIC</text>
      </g>

      <!-- Table Item 2: Orders -->
      <g transform="translate(16, 117)">
        <rect width="248" height="52" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="18" y="28" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#cbd5e1">orders</text>
        <text x="18" y="44" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">4 routes • private</text>
        <rect x="185" y="16" width="50" height="20" rx="10" fill="#ef4444" fill-opacity="0.2"/>
        <text x="210" y="30" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#f87171">PRIVATE</text>
      </g>

      <!-- Table Item 3: Products -->
      <g transform="translate(16, 179)">
        <rect width="248" height="52" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="18" y="28" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#cbd5e1">products</text>
        <text x="18" y="44" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">4 routes • public</text>
      </g>

      <!-- Table Item 4: Receipts -->
      <g transform="translate(16, 241)">
        <rect width="248" height="52" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="18" y="28" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#cbd5e1">receipts</text>
        <text x="18" y="44" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">4 routes • private</text>
      </g>

      <!-- Schema Sync Pill -->
      <g transform="translate(16, 640)">
        <rect width="248" height="42" rx="10" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="1"/>
        <text x="124" y="26" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">↻ Hot Sync: POST /_refresh</text>
      </g>
    </g>

    <!-- Main Panel: Endpoints Catalog & Interactive Inspector -->
    <g transform="translate(280, 112)">
      <!-- Panel Header -->
      <g transform="translate(36, 32)">
        <text x="0" y="24" font-family="-apple-system, sans-serif" font-size="24" font-weight="900" fill="#ffffff">Table: users</text>
        <text x="0" y="48" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b">REST Base Path: /api/v1/users</text>
      </g>

      <!-- Endpoints Badges Grid -->
      <g transform="translate(36, 95)">
        <!-- GET -->
        <g transform="translate(0, 0)">
          <rect width="260" height="46" rx="10" fill="#0b1324" stroke="#0284c7" stroke-width="1.2"/>
          <rect x="12" y="11" width="46" height="24" rx="6" fill="#0284c7"/>
          <text x="35" y="27" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#ffffff">GET</text>
          <text x="68" y="28" font-family="'JetBrains Mono', monospace" font-size="12" fill="#e2e8f0">/api/v1/users</text>
        </g>
        <!-- POST -->
        <g transform="translate(280, 0)">
          <rect width="260" height="46" rx="10" fill="#091815" stroke="#10b981" stroke-width="1.2"/>
          <rect x="12" y="11" width="52" height="24" rx="6" fill="#10b981"/>
          <text x="38" y="27" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#ffffff">POST</text>
          <text x="74" y="28" font-family="'JetBrains Mono', monospace" font-size="12" fill="#e2e8f0">/api/v1/users</text>
        </g>
        <!-- PATCH -->
        <g transform="translate(560, 0)">
          <rect width="260" height="46" rx="10" fill="#1a140b" stroke="#f59e0b" stroke-width="1.2"/>
          <rect x="12" y="11" width="56" height="24" rx="6" fill="#f59e0b"/>
          <text x="40" y="27" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#ffffff">PATCH</text>
          <text x="78" y="28" font-family="'JetBrains Mono', monospace" font-size="12" fill="#e2e8f0">/api/v1/users</text>
        </g>
        <!-- DELETE -->
        <g transform="translate(840, 0)">
          <rect width="260" height="46" rx="10" fill="#1f1013" stroke="#ef4444" stroke-width="1.2"/>
          <rect x="12" y="11" width="60" height="24" rx="6" fill="#ef4444"/>
          <text x="42" y="27" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#ffffff">DELETE</text>
          <text x="82" y="28" font-family="'JetBrains Mono', monospace" font-size="12" fill="#e2e8f0">/api/v1/users</text>
        </g>
      </g>

      <!-- Interactive Example JSON Generator Box -->
      <g transform="translate(36, 165)">
        <rect width="560" height="505" rx="14" fill="#090e18" stroke="#1e293b" stroke-width="1.5"/>
        <rect width="560" height="42" rx="14" fill="#0f172a"/>
        <text x="20" y="26" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Dynamic Example JSON Generator</text>
        <text x="540" y="26" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">GET Response</text>

        <!-- Formatted JSON View -->
        <text x="24" y="70" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f8fafc">[</text>
        <text x="40" y="95" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">{</text>
        <text x="56" y="120" font-family="'JetBrains Mono', monospace" font-size="12" fill="#7dd3fc">"id"<tspan fill="#f8fafc">: </tspan><tspan fill="#f59e0b">1</tspan><tspan fill="#f8fafc">,</tspan></text>
        <text x="56" y="145" font-family="'JetBrains Mono', monospace" font-size="12" fill="#7dd3fc">"name"<tspan fill="#f8fafc">: </tspan><tspan fill="#34d399">"Alice Developer"</tspan><tspan fill="#f8fafc">,</tspan></text>
        <text x="56" y="170" font-family="'JetBrains Mono', monospace" font-size="12" fill="#7dd3fc">"email"<tspan fill="#f8fafc">: </tspan><tspan fill="#34d399">"alice@example.com"</tspan><tspan fill="#f8fafc">,</tspan></text>
        <text x="56" y="195" font-family="'JetBrains Mono', monospace" font-size="12" fill="#7dd3fc">"role"<tspan fill="#f8fafc">: </tspan><tspan fill="#34d399">"admin"</tspan><tspan fill="#f8fafc">,</tspan></text>
        <text x="56" y="220" font-family="'JetBrains Mono', monospace" font-size="12" fill="#7dd3fc">"orders"<tspan fill="#f8fafc">: [</tspan></text>
        <text x="76" y="245" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">{</text>
        <text x="96" y="270" font-family="'JetBrains Mono', monospace" font-size="12" fill="#7dd3fc">"id"<tspan fill="#f8fafc">: </tspan><tspan fill="#f59e0b">101</tspan><tspan fill="#f8fafc">, </tspan><tspan fill="#7dd3fc">"total"</tspan><tspan fill="#f8fafc">: </tspan><tspan fill="#f59e0b">299.50</tspan><tspan fill="#f8fafc">, </tspan><tspan fill="#7dd3fc">"status"</tspan><tspan fill="#f8fafc">: </tspan><tspan fill="#34d399">"shipped"</tspan></text>
        <text x="76" y="295" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">}</text>
        <text x="56" y="320" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f8fafc">]</text>
        <text x="40" y="345" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">}</text>
        <text x="24" y="370" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f8fafc">]</text>

        <!-- Response Headers Box -->
        <g transform="translate(24, 395)">
          <rect width="512" height="85" rx="8" fill="#040711" stroke="#1e293b" stroke-width="1"/>
          <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">X-Dynago-Cache: HIT (in-memory)</text>
          <text x="14" y="44" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">Content-Type: application/json; charset=utf-8</text>
          <text x="14" y="64" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10b981">X-Dynago-Runtime: 0.72ms</text>
        </g>
      </g>

      <!-- Schema Inspector & 1-Click cURL Right Box -->
      <g transform="translate(620, 165)">
        <!-- Schema Inspector -->
        <g transform="translate(0, 0)">
          <rect width="530" height="280" rx="14" fill="#090e18" stroke="#1e293b" stroke-width="1.5"/>
          <rect width="530" height="42" rx="14" fill="#0f172a"/>
          <text x="20" y="26" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Schema Columns &amp; Constraints</text>

          <g transform="translate(20, 58)">
            <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="12" fill="#e2e8f0">id <tspan fill="#64748b">SERIAL</tspan></text>
            <rect x="220" y="6" width="95" height="18" rx="4" fill="#0284c7" fill-opacity="0.3"/>
            <text x="267" y="19" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8">PRIMARY KEY</text>

            <text x="0" y="55" font-family="'JetBrains Mono', monospace" font-size="12" fill="#e2e8f0">name <tspan fill="#64748b">VARCHAR(255)</tspan></text>
            <text x="220" y="55" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">NOT NULL</text>

            <text x="0" y="90" font-family="'JetBrains Mono', monospace" font-size="12" fill="#e2e8f0">email <tspan fill="#64748b">VARCHAR(255)</tspan></text>
            <text x="220" y="90" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">UNIQUE INDEX</text>

            <text x="0" y="125" font-family="'JetBrains Mono', monospace" font-size="12" fill="#e2e8f0">created_at <tspan fill="#64748b">TIMESTAMPTZ</tspan></text>
            <text x="220" y="125" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">DEFAULT NOW()</text>

            <text x="0" y="160" font-family="'JetBrains Mono', monospace" font-size="12" fill="#a855f7">orders ➔ Relation</text>
            <text x="220" y="160" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a855f7">HAS_MANY (1:N)</text>
          </g>
        </g>

        <!-- 1-Click cURL Playground Box -->
        <g transform="translate(0, 305)">
          <rect width="530" height="200" rx="14" fill="#090e18" stroke="#1e293b" stroke-width="1.5"/>
          <rect width="530" height="42" rx="14" fill="#0f172a"/>
          <text x="20" y="26" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Ready-to-Run cURL Playground</text>
          
          <rect x="420" y="8" width="95" height="26" rx="6" fill="#0284c7"/>
          <text x="467" y="25" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Copy cURL</text>

          <g transform="translate(20, 65)">
            <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f43f5e">curl <tspan fill="#cbd5e1">-X GET \</tspan></text>
            <text x="16" y="46" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8">"http://localhost:8080/api/v1/users?select=id,name,orders(id,total)&amp;id=eq.1" \</text>
            <text x="16" y="72" font-family="'JetBrains Mono', monospace" font-size="12" fill="#a855f7">-H "Authorization: Bearer $JWT_TOKEN"</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>