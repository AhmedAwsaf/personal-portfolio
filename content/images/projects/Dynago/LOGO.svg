<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="url(#boltGrad)" stroke-width="2.5" stroke-opacity="0.4"/>

  <!-- Subtle Database Cylinder Tier Rings in Background -->
  <g opacity="0.45" transform="translate(0, -20)">
    <!-- Top Cylinder Rim -->
    <ellipse cx="256" cy="150" rx="150" ry="42" fill="none" stroke="url(#ringGrad)" stroke-width="3" stroke-dasharray="8 6"/>
    <!-- Middle Cylinder Rim -->
    <ellipse cx="256" cy="225" rx="150" ry="42" fill="none" stroke="url(#ringGrad)" stroke-width="3"/>
    <!-- Bottom Cylinder Rim -->
    <ellipse cx="256" cy="300" rx="150" ry="42" fill="none" stroke="url(#ringGrad)" stroke-width="3" stroke-dasharray="14 8"/>
  </g>

  <!-- Glowing Central Speed Lightning / Dynamic Arrow -->
  <g filter="url(#glow)">
    <path d="M 285 95 
             L 165 260 
             L 245 260 
             L 225 415 
             L 355 235 
             L 275 235 
             Z"
          fill="url(#boltGrad)" />
  </g>

  <!-- Postgres Hex Ring Accents -->
  <circle cx="165" cy="260" r="6" fill="#00f2fe"/>
  <circle cx="355" cy="235" r="6" fill="#818cf8"/>
  <circle cx="285" cy="95" r="5" fill="#38bdf8"/>
  <circle cx="225" cy="415" r="5" fill="#6366f1"/>

  <!-- Logo Typography Badge -->
  <text x="256" y="468" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="9" fill="url(#textGrad)">DYNAGO</text>
</svg>