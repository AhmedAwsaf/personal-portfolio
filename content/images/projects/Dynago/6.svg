<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="secGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#060911"/>

  <g transform="translate(60, 40)">
    <rect width="1480" height="820" rx="20" fill="#0c111d" stroke="#1e293b" stroke-width="2"/>
    <rect width="1480" height="52" rx="20" fill="#111827"/>
    <rect y="40" width="1480" height="12" fill="#111827"/>

    <circle cx="28" cy="26" r="6" fill="#ef4444"/>
    <circle cx="48" cy="26" r="6" fill="#f59e0b"/>
    <circle cx="68" cy="26" r="6" fill="#10b981"/>

    <rect x="110" y="12" width="600" height="28" rx="8" fill="#080d1a" stroke="#1f293d" stroke-width="1"/>
    <text x="130" y="30" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8">http://localhost:8080/ui#permissions <tspan fill="#64748b">— RBAC &amp; Public/Private Visibility</tspan></text>

    <!-- Header -->
    <g transform="translate(0, 52)">
      <rect width="1480" height="56" fill="#0e1526" stroke="#1e293b" stroke-width="1"/>
      <text x="32" y="35" font-family="-apple-system, sans-serif" font-size="18" font-weight="900" fill="#ffffff" letter-spacing="2">DYNAGO</text>

      <g transform="translate(180, 12)">
        <text x="50" y="22" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Endpoints</text>
        <text x="160" y="22" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">SQL Console</text>
        <text x="280" y="22" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Live Stream</text>
        <rect x="380" y="0" width="165" height="32" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.2"/>
        <text x="462" y="21" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#34d399">Users &amp; Permissions</text>
      </g>

      <g transform="translate(1260, 12)">
        <rect width="180" height="32" rx="16" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
        <text x="90" y="21" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#34d399">RBAC ENFORCED</text>
      </g>
    </g>

    <!-- Main Content: Left User Table & Roles, Right Permissions Matrix -->
    <g transform="translate(36, 128)">
      <!-- Left Box: User Management & Registration -->
      <g transform="translate(0, 0)">
        <rect width="560" height="660" rx="16" fill="#090e18" stroke="#1e293b" stroke-width="1.5"/>
        <rect width="560" height="42" rx="16" fill="#0f172a"/>
        <text x="24" y="27" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Registered Users (_dynago_users)</text>

        <!-- New User Button -->
        <rect x="420" y="8" width="120" height="26" rx="6" fill="#10b981"/>
        <text x="480" y="25" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff">+ Add User</text>

        <!-- Users List -->
        <g transform="translate(24, 60)">
          <!-- User 1 -->
          <rect width="512" height="65" rx="10" fill="#0b1324" stroke="#1e293b" stroke-width="1"/>
          <circle cx="28" cy="32" r="16" fill="#0284c7" fill-opacity="0.3"/>
          <text x="28" y="37" text-anchor="middle" font-weight="700" fill="#38bdf8">A</text>
          <text x="56" y="28" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">admin</text>
          <text x="56" y="48" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">Salted SHA-256 • Active</text>
          <rect x="420" y="20" width="75" height="24" rx="12" fill="#ef4444" fill-opacity="0.2"/>
          <text x="457" y="36" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#f87171">ADMIN</text>
        </g>

        <g transform="translate(24, 135)">
          <!-- User 2 -->
          <rect width="512" height="65" rx="10" fill="#080e1a" stroke="#1e293b" stroke-width="1"/>
          <circle cx="28" cy="32" r="16" fill="#10b981" fill-opacity="0.2"/>
          <text x="28" y="37" text-anchor="middle" font-weight="700" fill="#34d399">E</text>
          <text x="56" y="28" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">john_editor</text>
          <text x="56" y="48" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">Salted SHA-256 • Active</text>
          <rect x="420" y="20" width="75" height="24" rx="12" fill="#f59e0b" fill-opacity="0.2"/>
          <text x="457" y="36" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#fbbf24">EDITOR</text>
        </g>

        <g transform="translate(24, 210)">
          <!-- User 3 -->
          <rect width="512" height="65" rx="10" fill="#080e1a" stroke="#1e293b" stroke-width="1"/>
          <circle cx="28" cy="32" r="16" fill="#6366f1" fill-opacity="0.2"/>
          <text x="28" y="37" text-anchor="middle" font-weight="700" fill="#818cf8">V</text>
          <text x="56" y="28" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">sara_viewer</text>
          <text x="56" y="48" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">Salted SHA-256 • Active</text>
          <rect x="420" y="20" width="75" height="24" rx="12" fill="#38bdf8" fill-opacity="0.2"/>
          <text x="457" y="36" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38bdf8">VIEWER</text>
        </g>

        <!-- JWT Token Issuance Spec -->
        <g transform="translate(24, 300)">
          <rect width="512" height="330" rx="12" fill="#040711" stroke="#1e293b" stroke-width="1"/>
          <text x="20" y="30" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38bdf8">JWT TOKEN LIFECYCLE &amp; AUTH HEADERS</text>

          <g transform="translate(20, 50)">
            <text x="0" y="16" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f43f5e">POST <tspan fill="#e2e8f0">/api/v1/_auth/login</tspan></text>
            <text x="0" y="38" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">Payload: {"username":"admin", "password":"..."}</text>

            <rect y="55" width="472" height="110" rx="8" fill="#090e18" stroke="#1e293b" stroke-width="1"/>
            <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="11" fill="#7dd3fc">"token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...",</text>
            <text x="14" y="44" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">"token_type": "Bearer",</text>
            <text x="14" y="64" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">"expires_in": 86400, "role": "admin"</text>
            <text x="14" y="88" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10b981">✓ Verified on every request via Authorization header</text>

            <text x="0" y="195" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Anonymous callers accessing private endpoints receive:</text>
            <text x="0" y="218" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f43f5e">HTTP 401: {"error": "authentication required: table is private"}</text>
          </g>
        </g>
      </g>

      <!-- Right Box: Granular Table Permissions Matrix & Public/Private Toggle -->
      <g transform="translate(585, 0)">
        <rect width="823" height="660" rx="16" fill="#090e18" stroke="#1e293b" stroke-width="1.5"/>
        <rect width="823" height="42" rx="16" fill="#0f172a"/>
        <text x="24" y="27" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Table-Level Permissions &amp; Public Visibility Matrix</text>

        <!-- Matrix Table Headers -->
        <g transform="translate(24, 60)">
          <rect width="775" height="44" rx="10" fill="#0e1526"/>
          <text x="20" y="27" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38bdf8">Table Name</text>
          <text x="200" y="27" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38bdf8">Public / Private</text>
          <text x="370" y="27" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38bdf8">Read</text>
          <text x="470" y="27" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38bdf8">Insert</text>
          <text x="570" y="27" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38bdf8">Update</text>
          <text x="670" y="27" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38bdf8">Delete</text>
        </g>

        <!-- Row 1: products (Public) -->
        <g transform="translate(24, 115)">
          <rect width="775" height="55" rx="8" fill="#0b111e"/>
          <text x="20" y="32" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#ffffff">products</text>
          
          <rect x="195" y="16" width="105" height="24" rx="12" fill="#10b981" fill-opacity="0.2"/>
          <text x="247" y="32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#34d399">PUBLIC (ANON)</text>

          <text x="375" y="32" font-size="16" fill="#10b981">✓</text>
          <text x="475" y="32" font-size="16" fill="#ef4444">✕</text>
          <text x="575" y="32" font-size="16" fill="#ef4444">✕</text>
          <text x="675" y="32" font-size="16" fill="#ef4444">✕</text>
        </g>

        <!-- Row 2: orders (Private) -->
        <g transform="translate(24, 180)">
          <rect width="775" height="55" rx="8" fill="#090e18"/>
          <text x="20" y="32" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#ffffff">orders</text>

          <rect x="195" y="16" width="105" height="24" rx="12" fill="#ef4444" fill-opacity="0.2"/>
          <text x="247" y="32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#f87171">PRIVATE (AUTH)</text>

          <text x="375" y="32" font-size="16" fill="#10b981">✓</text>
          <text x="475" y="32" font-size="16" fill="#10b981">✓</text>
          <text x="575" y="32" font-size="16" fill="#10b981">✓</text>
          <text x="675" y="32" font-size="16" fill="#ef4444">✕</text>
        </g>

        <!-- Row 3: users (Private) -->
        <g transform="translate(24, 245)">
          <rect width="775" height="55" rx="8" fill="#0b111e"/>
          <text x="20" y="32" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#ffffff">users</text>

          <rect x="195" y="16" width="105" height="24" rx="12" fill="#ef4444" fill-opacity="0.2"/>
          <text x="247" y="32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#f87171">PRIVATE (AUTH)</text>

          <text x="375" y="32" font-size="16" fill="#10b981">✓</text>
          <text x="475" y="32" font-size="16" fill="#ef4444">✕</text>
          <text x="575" y="32" font-size="16" fill="#10b981">✓</text>
          <text x="675" y="32" font-size="16" fill="#ef4444">✕</text>
        </g>

        <!-- Dynamic Toggle Info Box -->
        <g transform="translate(24, 330)">
          <rect width="775" height="300" rx="12" fill="#040711" stroke="#1e293b" stroke-width="1"/>
          <text x="24" y="32" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">Runtime Visibility Controls</text>
          
          <text x="24" y="65" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">Admins can toggle any table between Public and Private with 1-click in the UI or via REST:</text>

          <g transform="translate(24, 85)">
            <rect width="727" height="90" rx="8" fill="#090e18" stroke="#1e293b" stroke-width="1"/>
            <text x="16" y="26" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f43f5e">curl <tspan fill="#cbd5e1">-X PUT http://localhost:8080/api/v1/_auth/tables/products \</tspan></text>
            <text x="32" y="50" font-family="'JetBrains Mono', monospace" font-size="12" fill="#a855f7">-H "Authorization: Bearer $ADMIN_TOKEN" \</text>
            <text x="32" y="72" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8">-d '{"is_public": true}'</text>
          </g>

          <text x="24" y="215" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">• <tspan font-weight="700" fill="#ffffff">Public Tables:</tspan> Queryable anonymously without token. Great for blogs, products, catalogs.</text>
          <text x="24" y="240" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">• <tspan font-weight="700" fill="#ffffff">Private Tables:</tspan> Guaranteed locked behind JWT Bearer token authentication.</text>
          <text x="24" y="265" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">• <tspan font-weight="700" fill="#ffffff">Hidden Catalogs:</tspan> Non-authenticated callers cannot view private schema details.</text>
        </g>
      </g>
    </g>
  </g>
</svg>